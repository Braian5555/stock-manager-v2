name: Deploy functions

# Alternativa a Cloudflare para la lectura de facturas con IA: función de Firebase.
# Sólo a mano (Actions → Run workflow): requiere el plan Blaze y el secreto ANTHROPIC_API_KEY
# (firebase functions:secrets:set ANTHROPIC_API_KEY). Hoy se usa el worker de Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --omit=dev || npm install --omit=dev
        working-directory: functions
      - name: Credenciales
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx -y firebase-tools@14 deploy --only functions --project stock-manager-a7cf7 --force --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

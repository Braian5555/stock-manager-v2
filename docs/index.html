<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Manager se mudó</title>
  <meta http-equiv="refresh" content="3; url=https://stock-manager-a7cf7.web.app/" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f5f2; color: #22282b; padding: 16px; }
    main { max-width: 34ch; text-align: center; }
    a { color: #0e6b67; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Stock Manager se mudó</h1>
    <p>La app ahora está en <a href="https://stock-manager-a7cf7.web.app/">stock-manager-a7cf7.web.app</a>. Te llevamos en unos segundos.</p>
    <p>Si la tenías instalada en el celular, borrá este ícono e instalá la nueva desde esa dirección.</p>
  </main>
  <script>
    // Da de baja la versión vieja guardada en este dispositivo y borra sus datos sin conexión.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    }
    if (window.caches) caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
  </script>
</body>
</html>
